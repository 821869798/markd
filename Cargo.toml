[package]
name = "mkd"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[lib]
name = "mkd"
path = "src/lib.rs"

[[bin]]
name = "mkd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
directories = "6"
fuzzy-matcher = "0.3"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
